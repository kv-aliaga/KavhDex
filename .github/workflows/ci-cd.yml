name: CI e Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validar site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe do JavaScript
        run: |
          node --check js/script.js
          node --check js/change_color.js
      - name: Verificar página inicial e arquivos do site
        run: |
          test -s index.html
          test -s css/style.css
          test -s js/script.js
          test -s js/change_color.js
          test -s images/KavhDex.png
          test -s fonts/PressStart2P-Regular.ttf
          grep -q 'js/script.js' index.html
          grep -q 'css/style.css' index.html

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
