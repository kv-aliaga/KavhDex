<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO -->
    <title>KavhDex - Easy Pokédex | Search Pokémon by Name or Number</title>
    <meta name="description" content="KavhDex is a fast and easy Pokédex. Search any Pokémon by name or Pokédex number, view shiny sprites, types, and Pokédex entries. Powered by PokéAPI.">
    <meta name="keywords" content="pokedex, pokemon, kavhdex, shiny pokemon, pokemon sprites, pokeapi, pokemon search, easy pokedex">
    <meta name="author" content="Kavhsao / Kv-Aliaga">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://kv-aliaga.github.io/KavhDex/">

    <!-- Open Graph (Facebook, WhatsApp, Discord) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kv-aliaga.github.io/KavhDex/">
    <meta property="og:title" content="KavhDex - Easy Pokédex">
    <meta property="og:description" content="Search any Pokémon by name or Pokédex number. View sprites, shiny versions, types and Pokédex entries instantly.">
    <meta property="og:image" content="https://kv-aliaga.github.io/KavhDex/images/KavhDex.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="KavhDex">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://kv-aliaga.github.io/KavhDex/">
    <meta name="twitter:title" content="KavhDex - Easy Pokédex">
    <meta name="twitter:description" content="Search any Pokémon by name or Pokédex number. View sprites, shiny versions, types and Pokédex entries instantly.">
    <meta name="twitter:image" content="https://kv-aliaga.github.io/KavhDex/images/KavhDex.png">
    <meta name="twitter:creator" content="@kavhsao">

    <!-- Favicon -->
    <link rel="icon" href="images/KavhDex.png" type="image/png">
    <link rel="apple-touch-icon" href="images/KavhDex.png">

    <!-- Theme color (browser UI) -->
    <meta name="theme-color" content="#4caf50">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "KavhDex",
        "url": "https://kv-aliaga.github.io/KavhDex/",
        "description": "A fast and easy Pokédex. Search any Pokémon by name or number, view shiny sprites and Pokédex entries.",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "All",
        "author": {
            "@type": "Person",
            "name": "Kavhsao",
            "url": "https://github.com/kv-aliaga"
        },
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        }
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <h1 class="logo">KavhDex</h1>
            <p class="tagline">Your Easy Pokédex</p>
        </div>
    </header>
    <br>

    <div class="container">
        <!-- MAIN -->
        <main>
            <div class="sprite-box">
                <img src="#" alt="Pokémon Image" id="sprite">
            </div>
            <section class="controls">
                <form onsubmit="handleSubmit(); return false">
                    <input type="text" id="pokemon" autocomplete="off" maxlength="20" placeholder="Insert Pokémon's name or Pokédex number">
                </form>

                <div class="controls-row">
                    <span translate="no">Shiny:</span>
                    <div>
                        <input type="radio" name="shiny" value="true" id="shiny-yes">
                        <label for="shiny-yes">Yes</label>
                    </div>

                    <div>
                        <input type="radio" name="shiny" value="false" id="shiny-no" checked>
                        <label for="shiny-no">No</label>
                    </div>
                </div>

                <div class="nav-buttons">
                    <button type="button" id="prev">Previous</button>
                    <button type="button" id="next">Next</button>
                </div>
            </section>
        </main>

        <!-- USER INTERACTIVITY -->
        <aside class="info-card">
            <div class="card">
                <h2>
                    <span id="name" translate="no" style="text-transform: capitalize"></span> -
                    <span id="pokedexNumber"></span>
                </h2>
                <br>
                <span>The <span id="genera"></span></span>
                <p id="entry"></p>
            </div>
        </aside>

        <section class="controls theme-controls">
            <div class="controls-row">
                <span>Choose the theme</span>
                <div>
                    <input type="radio" name="theme" id="purple" value="purple">
                    <label for="purple">Purple</label>
                </div>

                <div>
                    <input type="radio" name="theme" id="red" value="red">
                    <label for="red">Red</label>
                </div>

                <div>
                    <input type="radio" name="theme" id="green" value="green" checked>
                    <label for="green">Green</label>
                </div>

                <div>
                    <input type="radio" name="theme" id="blue" value="blue">
                    <label for="blue">Blue</label>
                </div>

                <div>
                    <input type="radio" name="theme" id="yellow" value="yellow">
                    <label for="yellow">Yellow</label>
                </div>
            </div>
        </section>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-sections">
            <div>
                <h4>My social media</h4>
                <ul>
                    <li><a href="https://www.instagram.com/kavhsao" target="_blank">Instagram</a></li>
                    <li><a href="https://github.com/kv-aliaga" target="_blank">Github</a></li>
                </ul>
            </div>
            <div>
                <h4>Other projects you may like</h4>
                <a href="https://kv-aliaga.github.io/KavhFlix/" target="_blank">My other project (KavhFlix)</a>
                <br>
                <a href="https://pokeapi.co" target="_blank">Meet PokéAPI!</a>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2025 KavhDex/Kavhsao/Kv-Aliaga.</p>
        </div>
    </footer>

    <!-- IMPORTING JAVASCRIPT -->
    <script src="js/script.js"></script>
    <script src="js/change_color.js"></script>
</body>
</html>
